name: Publiser til GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'rings.json'
      - 'gullpris_historikk.json'
      - 'ring_historikk.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hent kode
        uses: actions/checkout@v5

      - name: Sett opp Pages
        uses: actions/configure-pages@v5

      - name: Sett opp publiseringsmappe
        run: |
          mkdir -p _site
          cp index.html manifest.json rings.json _site/
          [ -f gullpris_historikk.json ] && cp gullpris_historikk.json _site/ || echo "[]" > _site/gullpris_historikk.json
          [ -f ring_historikk.json ] && cp ring_historikk.json _site/ || echo "{}" > _site/ring_historikk.json

      - name: Last opp nettsiden som artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
