name: Gullpris og ringpris-varsler

on:
  schedule:
    # 06:00 UTC = 07:00 norsk vintertid / 08:00 sommertid.
    # Juster timen (første tall) om du vil ha varselet på et annet tidspunkt.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lar deg også trykke "Run workflow" manuelt for å teste

permissions:
  contents: write   # nødvendig for at jobben skal kunne lagre oppdatert prishistorikk

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Kjør prissjekk og send varsler
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 gullsmed_prisvarsler.py --debug

      - name: Lagre oppdatert prishistorikk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gullpris_historikk.json ring_historikk.json
          git diff --staged --quiet || git commit -m "Oppdater prishistorikk $(date -u +%Y-%m-%d)"
          git push
