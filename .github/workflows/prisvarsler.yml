name: Gullpris og ringpris-varsler

on:
  schedule:
    # 06:00 UTC = 07:00 norsk vintertid / 08:00 sommertid.
    # Juster timen (første tall) om du vil ha varselet på et annet tidspunkt.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lar deg også trykke "Run workflow" manuelt for å teste

permissions:
  contents: write   # nødvendig for at jobben skal kunne lagre oppdatert prishistorikk

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v5

      - name: Sett opp Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Kjør prissjekk og send varsler
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 gullsmed_prisvarsler.py --debug

      - name: Lagre oppdatert prishistorikk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for fil in gullpris_historikk.json gullpris_kilder_historikk.json ring_historikk.json; do
            if [ -f "$fil" ]; then
              git add "$fil"
            fi
          done
          if git diff --staged --quiet; then
            echo "Ingen endringer i prishistorikken."
          else
            git commit -m "Oppdater prishistorikk $(date -u +%Y-%m-%d)"
            for forsok in 1 2 3; do
              if git pull --rebase --autostash; then
                if git push; then
                  exit 0
                fi
              else
                konfliktfiler="$(git diff --name-only --diff-filter=U || true)"
                if [ -n "$konfliktfiler" ]; then
                  python3 gullsmed_prisvarsler.py --resolve-history-conflicts $konfliktfiler
                  git add $konfliktfiler
                  git rebase --continue
                  if git push; then
                    exit 0
                  fi
                else
                  exit 1
                fi
              fi
              echo "Push/rebase-race på forsøk $forsok, prøver igjen …"
              sleep $((forsok * 2))
            done
            echo "Klarte ikke lagre prishistorikken etter flere forsøk."
            exit 1
          fi
